
- name: Simple nginx installation
  gather_facts: yes
  hosts: web
  become: true

  tasks:

    - name: Install nginx and RTMP module
      ansible.builtin.apt:
        update_cache: yes
        pkg:
          - nginx
          - libnginx-mod-rtmp
        state: present

    - name: Create HLS streaming directory
      ansible.builtin.file:
        path: /var/www/html/stream/hls
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Deploy nginx main configuration
      ansible.builtin.template:
        src: nginx.conf.j2
        dest: /etc/nginx/nginx.conf
        owner: root
        group: root
        mode: '0644'

    - name: Deploy streaming virtualhost
      ansible.builtin.template:
        src: streamer.conf.j2
        dest: /etc/nginx/sites-enabled/streamer
        owner: root
        group: root
        mode: '0644'

    - name: Ensure nginx is running and enabled
      ansible.builtin.systemd:
        name: nginx
        state: started
        enabled: true
